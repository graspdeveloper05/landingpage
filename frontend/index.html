<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- SVG first for anything that takes it, then a raster fallback. iOS
         ignores SVG icons entirely and will screenshot the page instead if
         apple-touch-icon is absent, which on a navy site looks like a mistake. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://serinegaradialogue.org/" />
    <meta name="theme-color" content="#0B2140" />

    <title>Seri Negara Dialogue 2026 — A National Conversation on Malaysia's Future</title>
    <meta
      name="description"
      content="The inaugural Seri Negara Dialogue. 8 October 2026, Muzium Negara, Kuala Lumpur. Convened by Chevening Alumni Malaysia."
    />

    <!-- §11 — must display professionally when shared on WhatsApp, Facebook and LinkedIn. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seri Negara Dialogue" />
    <meta property="og:title" content="Seri Negara Dialogue 2026" />
    <meta
      property="og:description"
      content="A National Conversation on Malaysia's Future. 8 October 2026, Muzium Negara, Kuala Lumpur."
    />
    <meta property="og:url" content="https://serinegaradialogue.org/" />
    <meta property="og:image" content="https://serinegaradialogue.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_MY" />
    <meta property="og:locale:alternate" content="ms_MY" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="ta_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seri Negara Dialogue 2026" />
    <meta
      name="twitter:description"
      content="A National Conversation on Malaysia's Future. 8 October 2026, Muzium Negara, Kuala Lumpur."
    />
    <meta name="twitter:image" content="https://serinegaradialogue.org/og-image.jpg" />

    <!-- The hero image is the LCP element on every first visit. -->
    <!-- The hero photograph is the LCP element on every first visit. imagesrcset
         mirrors the <picture> in Hero.tsx so the preload matches what the
         browser will actually choose, instead of fetching the desktop file on
         a phone and then fetching the small one too. -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-scene.webp"
      imagesrcset="/hero/hero-scene-960.webp 960w, /hero/hero-scene.webp 1536w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
