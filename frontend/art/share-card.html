<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  /*
    §11 — the card shown when the link is shared on WhatsApp, Facebook or
    LinkedIn. Source for public/og-image.jpg; see the regeneration note at the
    bottom of this file.

    Built as a page rather than drawn as an SVG so it can use the site's own
    webfonts and its own photograph. An SVG rasteriser has neither, and a card
    set in a fallback serif announces itself as something made separately from
    the site it represents.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: #071A33;
    position: relative;
  }

  .scene {
    position: absolute;
    inset: 0;
    background-image: url('/hero/hero-scene.webp');
    background-size: cover;
    /* Biased right so the mansion, the skyline and the flag sit in the open
       half, clear of the type. */
    background-position: 62% 42%;
  }

  /* Dimmed as a whole, then taken down further on the left. One flat scrim
     strong enough for the headline would have milked the building out
     entirely; two passes keep the type legible AND the photograph visible. */
  .veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg,
        rgba(7,26,51,0.97) 0%,
        rgba(7,26,51,0.93) 32%,
        rgba(7,26,51,0.72) 52%,
        rgba(7,26,51,0.42) 72%,
        rgba(7,26,51,0.30) 100%),
      linear-gradient(180deg, rgba(7,26,51,0.35) 0%, rgba(7,26,51,0.10) 45%, rgba(7,26,51,0.55) 100%);
  }

  /* A warm lift under the wordmark, so the navy is not flat across 1200px. */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(70% 90% at 16% 78%, rgba(201,162,39,0.16) 0%, transparent 62%);
  }

  /* A hairline inset from the edge. It reads as a printed plate, and gives the
     card a defined edge against both a white chat window and a dark one. */
  .frame {
    position: absolute;
    inset: 26px;
    border: 1px solid rgba(201,162,39,0.42);
  }
  .frame::before,
  .frame::after {
    content: '';
    position: absolute;
    width: 34px; height: 34px;
    border: 2px solid #C9A227;
  }
  .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* Everything sits in the left 660px and clear of the inset frame. Mobile
     clients crop this card towards square from the right, so nothing that
     must be read is allowed past the middle. */
  .content {
    position: absolute;
    left: 78px;
    top: 50%;
    transform: translateY(-50%);
    width: 660px;
  }

  /*
    The arch mark, drawn rather than placed. brand/emblem.webp ships on a cream
    ground with no alpha, so inside a circular plate its corners showed as a
    pale square against the navy. Vector also means this is the same mark as
    the favicon, at any size, with nothing to go soft.
  */
  .seal {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 1px solid rgba(201,162,39,0.5);
    background: rgba(201,162,39,0.09);
    display: grid;
    place-items: center;
    margin-bottom: 28px;
  }
  .seal svg { width: 30px; height: 30px; display: block; }

  .eyebrow {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #D9B84A;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 68px;
    line-height: 1.03;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: #FCFCFB;
  }
  h1 .gold { color: #D9B84A; display: block; }

  .rule {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0 22px;
  }
  .rule i { display: block; height: 1px; width: 56px; background: rgba(201,162,39,0.6); }
  .rule b {
    display: block;
    width: 7px; height: 7px;
    background: #C9A227;
    transform: rotate(45deg);
  }
  .rule s { display: block; height: 1px; width: 22px; background: rgba(201,162,39,0.6); }

  .sub {
    font-size: 21px;
    font-weight: 400;
    color: rgba(252,252,251,0.82);
    letter-spacing: 0.01em;
  }

  .facts {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #FCFCFB;
  }
  .facts span.dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(201,162,39,0.85);
  }

  .domain {
    position: absolute;
    right: 78px;
    bottom: 62px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(252,252,251,0.62);
  }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="veil"></div>
  <div class="glow"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="seal">
      <svg viewBox="0 0 64 64" aria-hidden>
        <path
          fill="#D9B84A"
          fill-rule="evenodd"
          d="M14 50V30a18 18 0 0 1 36 0v20H14Zm10 0V30a8 8 0 0 1 16 0v20H24Z"
        />
        <rect x="9" y="50" width="46" height="7" rx="2.5" fill="#D9B84A"/>
      </svg>
    </div>

    <p class="eyebrow">Seri Negara Dialogue 2026</p>

    <h1>Many Histories.<span class="gold">One Future.</span></h1>

    <div class="rule"><i></i><b></b><s></s><b></b><i></i></div>

    <p class="sub">A National Conversation on Malaysia’s Future</p>

    <!-- Edit these two when the date or venue changes, then regenerate. -->
    <div class="facts">
      <span>8 October 2026</span>
      <span class="dot"></span>
      <span>Muzium Negara, Kuala Lumpur</span>
    </div>
  </div>

  <p class="domain">serinegaradialogue.org</p>
</body>
</html>

<!--
  REGENERATING public/og-image.jpg
  ────────────────────────────────
  1. Copy this file into backend/public/ so the photograph and fonts resolve:
       cp frontend/art/share-card.html backend/public/_card.html
  2. Open http://<the site>/_card.html at a viewport of exactly 1200 x 630,
     and screenshot the viewport (not the full page).
  3. If the screenshot came out at 2x, bring it back down and compress:
       npm install --no-save sharp
       node -e "require('sharp')('shot.png').resize(1200,630)
         .jpeg({quality:86,mozjpeg:true,chromaSubsampling:'4:4:4'})
         .toFile('frontend/public/og-image.jpg')"
  4. Delete backend/public/_card.html — it is not part of the site.

  Keep it under about 300 KB. Some chat clients stop fetching a preview image
  above that and fall back to showing a bare link.
-->
